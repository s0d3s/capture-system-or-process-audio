[package]
name = "capture-system-or-process-audio-macos"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "macOS Core Audio process tap, HAL input, and ScreenCaptureKit backend for capture-system-or-process-audio"
readme = "README.md"
homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
keywords = ["audio", "capture", "coreaudio", "screencapturekit", "macos"]
categories = ["multimedia::audio", "os::macos-apis", "hardware-support"]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "build.rs",
    "src/**",
]

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]

[workspace]

[dependencies]
capture-system-or-process-audio-core = { version = "1.3.1", path = "../capture-core" }

[profile.dev]
opt-level = 1

[features]
native-tests = []

[dev-dependencies]
allocation-counter = "=0.8.1"
serde_json = "=1.0.145"
