[package]
name = "capture-system-or-process-audio-core"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Safe-Rust portable PCM stream contracts, software mixer, resampler, and core backend traits for capture-system-or-process-audio"
readme = "README.md"
homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
keywords = ["audio", "capture", "pcm", "mixer", "loopback"]
categories = ["multimedia::audio", "hardware-support"]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
    "tests/**",
]

[package.metadata.docs.rs]
all-features = false

[workspace]

[dependencies]
crossbeam-utils = "=0.8.23"

[features]
test-hooks = []

[dev-dependencies]
allocation-counter = "=0.8.1"

[profile.dev]
opt-level = 1