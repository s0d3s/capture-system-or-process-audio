[package]
name = "capture-system-or-process-audio"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Unified safe-Rust cross-platform system, process, application, and microphone PCM audio capture facade"
readme = "README.md"
homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
keywords = ["audio", "capture", "loopback", "microphone", "pcm"]
categories = [
    "multimedia::audio",
    "hardware-support",
    "os::windows-apis",
    "os::linux-apis",
    "os::macos-apis",
]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
    "tests/**",
]

[package.metadata.docs.rs]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[workspace]

