[package]
name = "capture-system-or-process-audio-windows"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Windows WASAPI speaker loopback, process-tree, and microphone backend for capture-system-or-process-audio"
readme = "README.md"
homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
keywords = ["audio", "capture", "wasapi", "loopback", "windows"]
categories = ["multimedia::audio", "os::windows-apis", "hardware-support"]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[workspace]

[dependencies]
capture-system-or-process-audio-core = { version = "1.3.1", path = "../capture-core" }

