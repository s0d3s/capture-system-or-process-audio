[package]
name = "capture-system-or-process-audio-linux"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Runtime-loaded PipeWire and PulseAudio backend for capture-system-or-process-audio"
readme = "README.md"
homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
keywords = ["audio", "capture", "pipewire", "pulseaudio", "linux"]
categories = ["multimedia::audio", "os::linux-apis", "hardware-support"]
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "src/**",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[workspace]

[dependencies]
capture-system-or-process-audio-core = { version = "1.3.1", path = "../capture-core" }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"

[profile.dev]
opt-level = 1

[features]
native-tests = []

[dev-dependencies]
allocation-counter = "=0.8.1"
serde_json = "=1.0.145"
