[build-system]
requires = ["maturin>=1.16.0,<2.0"]
build-backend = "maturin"

[project]
name = "capture-system-or-process-audio"
version = "1.3.1"
description = "Cross-platform system loopback, per-process/app, and microphone PCM audio capture & live mixer (Windows WASAPI, Linux PipeWire/PulseAudio, macOS Core Audio/ScreenCaptureKit)"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
keywords = [
    "audio",
    "audio-capture",
    "loopback",
    "system-audio",
    "process-audio",
    "speaker-recording",
    "microphone",
    "pcm",
    "pyaudio",
    "pyaudiowpatch",
    "sounddevice",
    "wasapi",
    "pipewire",
    "pulseaudio",
    "coreaudio",
    "screencapturekit",
]
classifiers = [
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://s0d3s.github.io/capture-system-or-process-audio/"
Documentation = "https://s0d3s.github.io/capture-system-or-process-audio/"
Repository = "https://github.com/s0d3s/capture-system-or-process-audio"
Issues = "https://github.com/s0d3s/capture-system-or-process-audio/issues"
Releases = "https://github.com/s0d3s/capture-system-or-process-audio/releases"

