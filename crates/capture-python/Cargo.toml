[package]
name = "capture-system-or-process-audio-python"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "First-class PyO3 0.30.1 Python bindings (CPython 3.11-3.15 + free-threaded 3.14t/3.15t) onto unified capture-system-or-process-audio"
readme = "README.md"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
include = [
    "Cargo.toml",
    "pyproject.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "python/**",
    "src/**",
    "tests/**",
    "!**/__pycache__/**",
    "!**/*.pyc",
]

[workspace]

[lib]
name = "capture_system_or_process_audio"
crate-type = ["cdylib", "rlib"]

[features]
default = []
abi3-py311 = ["pyo3/abi3-py311"]
abi3t-py315 = ["pyo3/abi3-py315", "pyo3/abi3t-py315"]

[dependencies]
cspa_facade = { package = "capture-system-or-process-audio", path = "../capture", default-features = false }
pyo3 = { version = "=0.30.1", features = ["experimental-inspect"] }

[dev-dependencies]
allocation-counter = "=0.8.1"
pyo3-introspection = "=0.30.1"

[profile.dev]
opt-level = 1
