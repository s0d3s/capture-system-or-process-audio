[package]
name = "capture-system-or-process-audio-ffi"
version = "1.3.1"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Version-checked C11 ABI and header-only C++17 RAII SDK for capture-system-or-process-audio"
readme = "README.md"
repository = "https://github.com/s0d3s/capture-system-or-process-audio"
include = [
    "Cargo.toml",
    "README.md",
    "THIRD_PARTY_NOTICES.md",
    "cmake/**",
    "include/**",
    "src/**",
    "tests/**",
]

[workspace]

[lib]
name = "cspa_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
capture-system-or-process-audio = { path = "../capture", default-features = false }

[dev-dependencies]
allocation-counter = "=0.8.1"

[profile.dev]
opt-level = 1
