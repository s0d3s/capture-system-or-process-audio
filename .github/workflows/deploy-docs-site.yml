name: Deploy Documentation Site

on:
  workflow_dispatch:
    inputs:
      deploy_to_pages:
        description: "Deploy verified site to GitHub Pages (uncheck for dry-run artifact preview only)"
        required: false
        default: true
        type: boolean
      artifact_retention_days:
        description: "Days to retain downloadable site preview artifact (default: 7)"
        required: false
        type: number

permissions:
  contents: read

concurrency:
  group: deploy-docs-site
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build-and-verify:
    name: Build & Verify Static Docs Site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Cargo registry and rustdoc dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            crates/capture-core -> target/docs-site-rustdoc
            crates/capture -> target/docs-site-rustdoc

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Verify zero SDK API reference drift and run docs tooling unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/docs/generate_sdk_refs.py --check
          python3 -m unittest discover -s tools/docs -p 'test_*.py' -v

      - name: Install website npm dependencies
        run: npm --prefix website ci

      - name: Build self-hosted 5-crate Rust API documentation (/api/rust/)
        run: npm --prefix website run build:rustdoc

      - name: Build Astro Starlight site, Pagefind search index, sitemap, and llms.txt
        run: npm --prefix website run build:astro

      - name: Verify built HTML metadata, JSON-LD, internal & rustdoc links, and assets
        run: python3 tools/docs/verify_built_site.py --dist website/dist --base /capture-system-or-process-audio

      - name: Upload downloadable docs-site-preview artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-preview
          path: website/dist
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 7 }}

      - name: Configure GitHub Pages
        if: ${{ inputs.deploy_to_pages }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages deployment artifact
        if: ${{ inputs.deploy_to_pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy-pages:
    name: Deploy to GitHub Pages (OIDC)
    needs: build-and-verify
    if: ${{ inputs.deploy_to_pages }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Write deployment summary
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Documentation Site Deployed"
            echo ""
            echo "- **Live URL:** ${PAGE_URL}"
            echo "- **Rust API Portal:** ${PAGE_URL}api/rust/capture_system_or_process_audio/index.html"
            echo "- **LLM Context Pack:** ${PAGE_URL}llms-full.txt"
          } >> "${GITHUB_STEP_SUMMARY}"
