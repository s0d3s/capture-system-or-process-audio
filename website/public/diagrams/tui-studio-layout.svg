  <text x="602" y="148" fill="#FDE047" font-family="Consolas, monospace" font-size="12" textLength="516" lengthAdjust="spacingAndGlyphs">Converter:[ON ]  [16000 Hz]  [Mono]  [F32] [Dither:TPDF] [Idle:Silence] [DropOldest]</text>
  <text x="602" y="172" fill="#4ADE80" font-family="Consolas, monospace" font-size="12" textLength="516" lengthAdjust="spacingAndGlyphs">Combine : CspaMixer (48kHz Stereo F32)  |  Targets: #0:WASAPI:Endpt, #1:WASAPI:Kernel</text>
  <text x="602" y="192" fill="#22D3EE" font-family="Consolas, monospace" font-size="12">Budgets : 3 str, 1152 KiB | SoftwareSummation (dup:0)</text>
  <line x1="602" y1="205" x2="1118" y2="205" stroke="#1E293B" stroke-width="1"/>
  <text x="602" y="224" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">Perm: Mic:OK* Sys:OK* Scr:--                      [Pol:AutoRq]</text>
  <text x="602" y="244" fill="#67E8F9" font-family="Consolas, monospace" font-size="12">[Re-Check]    [Ask Needed]    [Perms UI (K)]</text>

