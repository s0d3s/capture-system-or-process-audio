<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1160" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="100%" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>

  <rect width="1160" height="660" rx="18" fill="url(#bg)"/>
  <rect x="12" y="12" width="1136" height="636" rx="14" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>

  <!-- Top Header Bar -->
  <rect x="26" y="26" width="1108" height="44" rx="8" fill="#111C33" stroke="#22D3EE" stroke-width="1.5"/>
  <text x="42" y="53" fill="#22D3EE" font-family="Consolas, monospace" font-size="14" font-weight="700">CSPA Studio</text>
  <rect x="148" y="35" width="190" height="26" rx="4" fill="#22D3EE"/>
  <text x="243" y="53" text-anchor="middle" fill="#070B14" font-family="Consolas, monospace" font-size="12" font-weight="700">LIVE MONITOR / ● REC</text>
  <text x="435" y="53" text-anchor="middle" fill="#67E8F9" font-family="Consolas, monospace" font-size="13" font-weight="700">[+ Add Source (A)]</text>
  <text x="605" y="53" text-anchor="middle" fill="#4ADE80" font-family="Consolas, monospace" font-size="13" font-weight="700">[● Record (R)]</text>
  <text x="770" y="53" text-anchor="middle" fill="#FDE047" font-family="Consolas, monospace" font-size="13" font-weight="700">[Perms: OK (K)]</text>
  <text x="930" y="53" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">[Mon: ON (M)]</text>
  <text x="1065" y="53" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="13" font-weight="700">[Synth:OFF (T)]</text>

  <!-- Panel [1] Staged Audio Sources -->
  <rect x="26" y="82" width="546" height="176" rx="10" fill="#0C1424" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="104" fill="#FACC15" font-family="Consolas, monospace" font-size="13" font-weight="700">[1] Staged Audio Sources (checked - live hot-swap)</text>
  <text x="42" y="132" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">&gt; [x] [SYS] Default System Output</text>
  <text x="310" y="132" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">[AUTO] [1.0x] [follow]    [+2x] [x]</text>
  <text x="42" y="156" fill="#E879F9" font-family="Consolas, monospace" font-size="12">  [x] [MIC] Default Microphone</text>
  <text x="310" y="156" fill="#FDE047" font-family="Consolas, monospace" font-size="12">[AUTO] [1.5x] [follow]    [+2x] [x]</text>
  <text x="42" y="180" fill="#22D3EE" font-family="Consolas, monospace" font-size="12">  [x] [APP] Zoom Workplace</text>
  <text x="310" y="180" fill="#A5B4FC" font-family="Consolas, monospace" font-size="12" textLength="246" lengthAdjust="spacingAndGlyphs">[WASAPI] [1.0x] [tree] [wait5s] [+2x] [x]</text>
  <text x="42" y="210" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">Alerts: [MIC!] Denied/Restricted · [APP~] Relaunch Needed</text>
  <text x="42" y="242" fill="#67E8F9" font-family="Consolas, monospace" font-size="12" textLength="514" lengthAdjust="spacingAndGlyphs">[+ Add Source]   [All On]   [All Off]   (Space: toggle · D: +2x · Del: remove)</text>

