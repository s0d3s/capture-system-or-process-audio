  <rect x="26" y="570" width="1108" height="46" rx="10" fill="#121926" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="42" y="598" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">💬 Voice Strip: [● Rec / ▶ Play]</text>
  <text x="290" y="598" fill="#5FF2D6" font-family="Consolas, monospace" font-size="14">⡀⡄⡆⡇▍⡇⡆⡄⡀⡆⡇▍▍⡇⡆⡄⡀⡄⡆⡇▍⡇⡆ (Click capsule waveform to seek)</text>
  <text x="1116" y="598" text-anchor="end" fill="#FDE047" font-family="Consolas, monospace" font-size="12" font-weight="700">Take #01 · [💾 WAV]</text>

  <!-- Status Footer + Modal Note -->
  <text x="36" y="636" fill="#22D3EE" font-family="Consolas, monospace" font-size="12" font-weight="700">STATUS</text>
  <text x="102" y="636" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">Overlays: Modal A = Add Capture Sources (4 tabs + Hover Inspector)  ·  Modal K = OS Recording Permissions &amp; Consent</text>
</svg>
