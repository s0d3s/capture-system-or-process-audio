  <rect x="26" y="270" width="1108" height="154" rx="10" fill="#0B1324" stroke="#22D3EE" stroke-width="1.6"/>
  <text x="42" y="292" fill="#22D3EE" font-family="Consolas, monospace" font-size="13" font-weight="700">[3] Live Spectroscope (Press V or click tab)</text>
  <rect x="42" y="302" width="160" height="22" rx="4" fill="#22D3EE"/>
  <text x="122" y="317" text-anchor="middle" fill="#070B14" font-family="Consolas, monospace" font-size="12" font-weight="700">[1] FFT Spectrum</text>
  <text x="285" y="317" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">[2] Waterfall Map</text>
  <text x="455" y="317" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">[3] Oscilloscope</text>
  <text x="1010" y="317" text-anchor="middle" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">[◉ Idle Monitor: ON (M)]</text>

  <!-- Simulated FFT bars -->
  <path d="M55 376 V350 M75 376 V336 M95 376 V328 M115 376 V342 M135 376 V330 M155 376 V324 M175 376 V338 M195 376 V346 M215 376 V354 M235 376 V335 M255 376 V329 M275 376 V344 M295 376 V358 M315 376 V362 M335 376 V349 M355 376 V340 M375 376 V352 M395 376 V360 M415 376 V366 M435 376 V355 M455 376 V348" stroke="url(#accent)" stroke-width="10" stroke-linecap="butt"/>
  <text x="640" y="355" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">2048-pt Hann FFT + Peak Hold · Truecolor Waterfall · Zero-Crossing Braille Scope</text>
  <text x="42" y="394" fill="#64748B" font-family="Consolas, monospace" font-size="11">20Hz      50Hz     100Hz     250Hz     500Hz      1kHz      2kHz      4kHz      8kHz     16kHz    20kHz</text>
  <text x="42" y="414" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">L [████████████████░░░░░░] -6.2dB (rms -14.8)        R [███████████████░░░░░░░] -6.8dB (rms -15.1)</text>

  <!-- Panel [4] Telemetry -->
  <rect x="26" y="436" width="546" height="122" rx="10" fill="#0C1424" stroke="#475569" stroke-width="1.5"/>
  <text x="42" y="458" fill="#FACC15" font-family="Consolas, monospace" font-size="13" font-weight="700">[4] Active Stream &amp; Mixer Telemetry</text>
  <text x="42" y="482" fill="#F8FAFC" font-family="Consolas, monospace" font-size="12">Session  : 96000 frames (750.0 KiB) | Segs: 2 | Mask: 0x7</text>
  <text x="42" y="502" fill="#22D3EE" font-family="Consolas, monospace" font-size="12">CspaMixer: Skew cross-clock | Clips:0 | Slips:1 | Late:0</text>
  <text x="42" y="524" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">#0 [ACTIVE] [48k-&gt;48k BYPASS] default_output (q:1 slp:0)</text>
  <text x="42" y="544" fill="#E879F9" font-family="Consolas, monospace" font-size="12">#1 [ACTIVE] [16k 1ch-&gt;48k 2ch SYNC] usb_mic (q:1 slp:1)</text>

  <!-- Panel [5] In-Memory Takes -->
  <rect x="586" y="436" width="548" height="122" rx="10" fill="#0C1424" stroke="#475569" stroke-width="1.5"/>
  <text x="602" y="458" fill="#FACC15" font-family="Consolas, monospace" font-size="13" font-weight="700">[5] In-Memory Takes &amp; Playback ([ / ] to select)</text>
  <text x="602" y="482" fill="#F8FAFC" font-family="Consolas, monospace" font-size="12">&gt; ▶ Take #01 ( 12.4s | 16000Hz 1ch F32 | segs:2) [RAM ONLY ]</text>
  <text x="602" y="502" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">    Take #02 (  5.0s | 48000Hz 2ch I16 | segs:1) [SAVED WAV]</text>
  <text x="602" y="524" fill="#4ADE80" font-family="Consolas, monospace" font-size="12">Seek: [━━━━━━━━━━●─────────] 06.2s/12.4s   (Click or Left/Right ±5%)</text>
  <text x="602" y="546" fill="#FDE047" font-family="Consolas, monospace" font-size="12">[▶ Play RAM (P)]   [■ Stop (S)]   [💾 Save WAV (W)]   [Delete]</text>

